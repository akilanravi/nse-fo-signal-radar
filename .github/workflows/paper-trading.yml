name: Nightly F&O Paper Trading
on:
  schedule:
    - cron: '17 17 * * 1-5' # 22:47 IST / 20:17 Saudi
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview saves Excel and CSV to Actions; send also sends Excel to Telegram'
        type: choice
        options: [preview, send]
        default: preview
permissions:
  contents: read
concurrency:
  group: nse-fo-paper-replay
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-paper.txt
      - run: python -m pip install -r requirements.txt -r requirements-paper.txt
      - name: Replay recorded Dhan candles
        env:
          PAPER_MODE: ${{ inputs.mode || 'send' }}
          PAPER_EVENT: ${{ github.event_name }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN_1: ${{ secrets.TELEGRAM_BOT_TOKEN_1 }}
          TELEGRAM_CHAT_ID_1: ${{ secrets.TELEGRAM_CHAT_ID_1 }}
        run: python -u paper_replay.py
      - name: Save Excel workbook, trade CSV and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: paper-trading-results
          path: .paper-output/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
